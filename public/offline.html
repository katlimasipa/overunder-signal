<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a67aa" />
    <title>Offline · OverUnderAuto</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #f4f8fc;
        color: #14263a;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        color: #536477;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101923;
          color: #eef5fb;
        }
        p {
          color: #aab8c8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Reconnect to Deriv to trade. Your saved trade history stays on this device.</p>
    </main>
  </body>
</html>
